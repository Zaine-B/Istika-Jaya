<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PDF Flipbook</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #202020;
}

/* =========================
   MAIN CONTAINER
========================= */

.flipbook-app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    height: 60px;
    min-height: 60px;
    background: #111;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    padding: 8px 12px;
    z-index: 1000;
}

.toolbar button {
    border: none;
    background: #333;
    color: white;

    min-width: 42px;
    height: 40px;

    border-radius: 6px;
    cursor: pointer;

    font-size: 18px;

    transition: 0.2s;
}

.toolbar button:hover {
    background: #555;
}

.toolbar button:active {
    transform: scale(0.95);
}

.page-info {
    min-width: 100px;
    text-align: center;
    font-size: 14px;
}

/* =========================
   BOOK AREA
========================= */

.book-area {
    flex: 1;
    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #444 0%,
            #222 60%,
            #111 100%
        );
}

/* =========================
   BOOK
========================= */

.book-wrapper {
    position: relative;

    width: min(90vw, 900px);
    height: min(82vh, 650px);

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 2500px;

    transform-origin: center center;

    transition: transform 0.25s ease;
}

.book {
    position: relative;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;
}

/* =========================
   PDF PAGE
========================= */

.page {
    position: absolute;

    top: 0;
    left: 50%;

    width: 50%;
    height: 100%;

    background: white;

    overflow: hidden;

    transform-origin: left center;

    transform-style: preserve-3d;

    box-shadow:
        0 10px 30px rgba(0,0,0,.45);

    transition:
        transform 0.9s cubic-bezier(.645,.045,.355,1);

    backface-visibility: hidden;

    user-select: none;
}

.page canvas {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: white;
}

/* Right page */

.page.right {
    left: 50%;
    transform-origin: left center;
}

/* Turned page */

.page.flipped {
    transform: rotateY(-180deg);
}

/* =========================
   PAGE SHADOW
========================= */

.page::after {
    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.18),
            transparent 25%
        );

    opacity: 0;

    transition: opacity .4s;
}

.page.flipped::after {
    opacity: 1;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .toolbar {
        height: 55px;
        min-height: 55px;
    }

    .toolbar button {
        width: 38px;
        min-width: 38px;
        height: 36px;
        font-size: 16px;
    }

    .page-info {
        min-width: 80px;
        font-size: 12px;
    }

    .book-wrapper {
        width: 96vw;
        height: 82vh;
    }

    /*
       On small screens only one page is displayed.
    */

    .page {
        left: 0;
        width: 100%;
    }

    .page.right {
        left: 0;
    }
}

/* =========================
   LOADING
========================= */

.loading {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: 18px;

    z-index: 2000;
}

/* =========================
   FULLSCREEN
========================= */

:fullscreen .toolbar {
    background: #000;
}
</style>
</head>


<body>

<div class="flipbook-app">

    <!-- TOOLBAR -->

    <div class="toolbar">

        <button id="prevBtn"
                title="Previous page">
            ◀
        </button>

        <button id="nextBtn"
                title="Next page">
            ▶
        </button>

        <span class="page-info">
            Page
            <span id="currentPage">1</span>
            /
            <span id="totalPages">0</span>
        </span>

        <button id="zoomOut"
                title="Zoom out">
            −
        </button>

        <button id="zoomIn"
                title="Zoom in">
            +
        </button>

        <button id="zoomReset"
                title="Reset zoom">
            100%
        </button>

        <button id="fullscreenBtn"
                title="Fullscreen">
            ⛶
        </button>

    </div>


    <!-- BOOK AREA -->

    <div class="book-area">

        <div class="loading"
             id="loading">
            Loading PDF...
        </div>

        <div class="book-wrapper"
             id="bookWrapper">

            <div class="book"
                 id="book">
            </div>

        </div>

    </div>

</div>


<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module">
</script>


<script type="module">

import * as pdfjsLib
    from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


/* =========================
   PDF CONFIGURATION
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/*
    CHANGE THIS TO YOUR PDF FILE
*/

const PDF_URL = "IstikaJaya.pdf";


/* =========================
   ELEMENTS
========================= */

const book =
    document.getElementById("book");

const loading =
    document.getElementById("loading");

const currentPage =
    document.getElementById("currentPage");

const totalPages =
    document.getElementById("totalPages");

const bookWrapper =
    document.getElementById("bookWrapper");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const zoomIn =
    document.getElementById("zoomIn");

const zoomOut =
    document.getElementById("zoomOut");

const zoomReset =
    document.getElementById("zoomReset");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


/* =========================
   VARIABLES
========================= */

let pdfDocument = null;

let pages = [];

let current = 0;

let zoom = 1;

let startX = 0;

let dragging = false;


/* =========================
   LOAD PDF
========================= */

async function loadPDF() {

    try {

        pdfDocument =
            await pdfjsLib.getDocument(PDF_URL)
                .promise;

        totalPages.textContent =
            pdfDocument.numPages;

        loading.style.display =
            "none";

        await createPages();

        updateBook();

    }

    catch(error) {

        loading.textContent =
            "Unable to load PDF.";

        console.error(error);

    }

}


/* =========================
   CREATE PAGES
========================= */

async function createPages() {

    for (
        let i = 1;
        i <= pdfDocument.numPages;
        i++
    ) {

        const pdfPage =
            await pdfDocument.getPage(i);

        const viewport =
            pdfPage.getViewport({
                scale: 1.5
            });

        const canvas =
            document.createElement("canvas");

        const context =
            canvas.getContext("2d");

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        await pdfPage.render({
            canvasContext: context,
            viewport: viewport
        }).promise;


        const page =
            document.createElement("div");

        page.className = "page";

        page.dataset.index =
            i - 1;

        page.appendChild(canvas);

        book.appendChild(page);

        pages.push(page);

    }

}


/* =========================
   UPDATE BOOK
========================= */

function updateBook() {

    pages.forEach(
        (page, index) => {

            if (index < current) {

                page.classList.add(
                    "flipped"
                );

            } else {

                page.classList.remove(
                    "flipped"
                );

            }

            /*
                Z-index keeps pages in
                correct stacking order.
            */

            page.style.zIndex =
                pages.length - index;

        }
    );


    currentPage.textContent =
        Math.min(
            current + 1,
            pages.length
        );

}


/* =========================
   NEXT PAGE
========================= */

function nextPage() {

    if (
        current <
        pages.length - 1
    ) {

        current++;

        updateBook();

    }

}


/* =========================
   PREVIOUS PAGE
========================= */

function previousPage() {

    if (current > 0) {

        current--;

        updateBook();

    }

}


/* =========================
   BUTTONS
========================= */

nextBtn.addEventListener(
    "click",
    nextPage
);

prevBtn.addEventListener(
    "click",
    previousPage
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPage();

        }

        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPage();

        }

    }
);


/* =========================
   ZOOM
========================= */

function updateZoom() {

    bookWrapper.style.transform =
        `scale(${zoom})`;

}


zoomIn.addEventListener(
    "click",
    () => {

        zoom += 0.1;

        if (zoom > 2.5)
            zoom = 2.5;

        updateZoom();

    }
);


zoomOut.addEventListener(
    "click",
    () => {

        zoom -= 0.1;

        if (zoom < 0.5)
            zoom = 0.5;

        updateZoom();

    }
);


zoomReset.addEventListener(
    "click",
    () => {

        zoom = 1;

        updateZoom();

    }
);


/* =========================
   MOUSE DRAG
========================= */

book.addEventListener(
    "mousedown",
    event => {

        dragging = true;

        startX =
            event.clientX;

    }
);


document.addEventListener(
    "mouseup",
    event => {

        if (!dragging)
            return;

        dragging = false;

        const difference =
            event.clientX - startX;


        if (
            Math.abs(difference) > 60
        ) {

            if (difference < 0)
                nextPage();
            else
                previousPage();

        }

    }
);


/* =========================
   TOUCH
========================= */

book.addEventListener(
    "touchstart",
    event => {

        startX =
            event.touches[0].clientX;

    },
    { passive: true }
);


book.addEventListener(
    "touchend",
    event => {

        const endX =
            event.changedTouches[0].clientX;

        const difference =
            endX - startX;


        if (
            Math.abs(difference) > 50
        ) {

            if (difference < 0)
                nextPage();
            else
                previousPage();

        }

    },
    { passive: true }
);


/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        if (!document.fullscreenElement) {

            await document
                .documentElement
                .requestFullscreen();

        } else {

            await document
                .exitFullscreen();

        }

    }
);


/* =========================
   START
========================= */

loadPDF();

</script>

</body>
</html>
